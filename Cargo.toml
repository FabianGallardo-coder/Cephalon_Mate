[package]
name = "cehalon-mate"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Asistente de Warframe con IA local (Ollama) en Rust"
license = "MIT"
repository = "https://github.com/FabianGallardo-coder/Cephalon_Mate"
readme = "README.md"

[features]
default = []  # TUI only por defecto
gui = ["eframe", "egui", "egui_extras", "image"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rodio = "0.19.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"
ureq = { version = "3.5.2", features = ["json"] }
urlencoding = "2.1"
crossbeam-channel = "0.5"

# GUI (egui/eframe) - optional, solo si se compila con feature "gui"
eframe = { version = "0.30", features = ["default", "accesskit", "persistence"], optional = true }
egui = { version = "0.30", optional = true }
egui_extras = { version = "0.30", optional = true }
image = { version = "0.25", features = ["png", "jpeg", "dds"], optional = true }
