name: CI

on:
  push:
    branches: [main, master, Master]
  pull_request:
    branches: [main, master, Master]
  schedule:
    # QA exhaustivo diario (03:00 UTC) — gate duro para detectar cambios upstream
    - cron: '0 3 * * *'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (for rodio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build (debug)
        run: cargo build

      - name: Run tests
        run: cargo test --verbose

      - name: Build release
        run: cargo build --release

      - name: Smoke test
        run: |
          ./target/release/cehalon-mate --smoke | tee smoke.log
          grep -q "Worldstate actualizado" smoke.log
          echo "✅ Smoke test passed"

      # QA de datos en push/PR: informativo (continue-on-error: true).
      # Depende de GitHub/raw.githubusercontent.com; un corte de red no debe
      # bloquear la release. El gate duro corre en el scheduled diario.
      - name: QA de datos (WFCD) — informativo
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          ./target/release/cehalon-mate --qa --sync | tee qa.log
          grep -q "RESULTADO QA: ✅ PASS" qa.log
          echo "✅ QA de datos passed"

      # QA de datos en scheduled: gate duro (falla el workflow si hay problemas).
      - name: QA de datos (WFCD) — gate duro (scheduled)
        if: github.event_name == 'schedule'
        run: |
          ./target/release/cehalon-mate --qa --sync | tee qa.log
          grep -q "RESULTADO QA: ✅ PASS" qa.log
          echo "✅ QA de datos passed (scheduled gate)"
