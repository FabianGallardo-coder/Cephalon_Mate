name: CI

on:
  push:
    branches: [main, master, Master]
  pull_request:
    branches: [main, master, Master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system deps (for rodio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build (debug)
        run: cargo build

      - name: Run tests
        run: cargo test --verbose

      - name: Build release
        run: cargo build --release

      - name: Smoke test
        run: |
          ./target/release/cehalon-mate --smoke | tee smoke.log
          grep -q "Worldstate actualizado" smoke.log
          echo "✅ Smoke test passed"

      # QA de datos: sincroniza WFCD y comprueba warframes/mods/drops.
      # Es informativo (continue-on-error) porque depende de que GitHub/raw
      # esté disponible; un corte de red no debe invalidar la release.
      - name: QA de datos (WFCD)
        continue-on-error: true
        run: |
          ./target/release/cehalon-mate --qa --sync | tee qa.log
          grep -q "RESULTADO QA: ✅ PASS" qa.log
          echo "✅ QA de datos passed"
